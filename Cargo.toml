[package]
name = "tidal-discord-rpc"
version = "2.0.0"
edition = "2024"
description = "Accurate TIDAL playback status for Discord Rich Presence"
license = "MIT"

[dependencies]
anyhow = "1.0"
discord-rich-presence = "1.1"
futures-lite = "2.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
tray-icon = { version = "0.24", default-features = false }
windows = { version = "0.62", features = [
    "Foundation",
    "Media_Control",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
strip = true
